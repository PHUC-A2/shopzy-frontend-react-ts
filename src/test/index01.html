<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>QR Code Access Token</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            font-family: Arial, sans-serif;
        }

        #qrcode {
            margin-top: 20px;
            padding: 10px;
            border: 2px dashed #444;
            background: #f9f9f9;
        }

        .token {
            margin-top: 30px;
            word-break: break-all;
            max-width: 600px;
            font-size: 14px;
            color: #333;
            background: #eee;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h2>Mã QR chứa access_token</h2>
    <div id="qrcode"></div>

    <div class="token" id="tokenText"></div>

    <script>
        // Access token bạn đưa
        const accessToken = "eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJ1c2VyXzAxQGdtYWlsLmNvbSIsInBlcm1pc3Npb24iOlsiUk9MRV9VU0VSX0NSRUFURSIsIlJPTEVfVVNFUl9VUERBVEUiXSwiZXhwIjoxNzY2MTYzMTQ3LCJpYXQiOjE3NTc1MjMxNDcsInVzZXIiOnsiaWQiOjIsImVtYWlsIjoidXNlcl8wMUBnbWFpbC5jb20iLCJuYW1lIjoidXNlcl8wMSJ9fQ.IIojMKm9XdZbEJe-chQGz5IlLmZCLFVPfAv7tRK2AMkvrWXcuxomYNz8ST4lv5BX0Pq-lTLwi20voc0UMr44Ig";

        // Render QR
        new QRCode(document.getElementById("qrcode"), {
            text: accessToken,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // Hiển thị token dưới QR để đối chiếu
        document.getElementById("tokenText").innerText = accessToken;
    </script>
</body>

</html>
